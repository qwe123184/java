# ============ 基础 ============
server.port=8081

# ============ 数据源（MySQL 8） ============
# 注意：URL 不指定具体库名，连接到 MySQL 服务本身；
# 应用启动时会通过 spring.sql.init 自动执行 schema.sql 创建库 zhan_shen 与表 t_user。
# 密码通过环境变量 DB_PASSWORD 注入，未设置时回退到本地默认（123456）。
# 提交到 git 前，建议把默认值改为占位符（如 CHANGE_ME）并通过环境变量提供真实密码。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}

# ============ 启动时自动建库建表 ============
# schema.sql 位于 src/main/resources，含 CREATE DATABASE IF NOT EXISTS 与 CREATE TABLE IF NOT EXISTS，
# 幂等，可重复执行；也可手动执行 sql/init.sql 代替本自动建表。
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql

# ============ MyBatis-Plus ============
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-prefix=

# ============ API 文档（springdoc / Swagger UI） ============
# 访问：http://localhost:8081/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true

# ============ 健康监控（Actuator） ============
# 访问：http://localhost:8081/actuator/health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ============ JWT 配置 ============
# 密钥（HS256，生产环境请改为足够长且保密的随机串，并通过环境变量注入）
jwt.secret=${JWT_SECRET:ZhanShenFengLinJiSu2026Hs256SecretKeyMustBeLongEnoughForSecurityXXXX}
# 刷新令牌有效期（秒），默认 7 天
jwt.expiration=${JWT_EXPIRATION:604800}
# 访问令牌有效期（秒），默认 15 分钟
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900}

# ============ 跨域（CORS） ============
# 允许的前端来源（逗号分隔）。开发期默认 * 放行所有来源；
# 生产环境请改为前端真实地址，如 http://localhost:5173,https://your-domain.com
# 注意：一旦改成具体地址，浏览器只有来自这些地址的请求才会被允许携带凭据（Cookie / 鉴权头）。
cors.allowed-origins=*
